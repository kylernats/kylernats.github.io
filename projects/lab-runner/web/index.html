<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Runner — Kyler Nats</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B0D10'/><text y='68' x='50' text-anchor='middle' font-size='48' font-family='monospace' font-weight='bold' fill='%232DD4BF'>KN</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand"><span class="mark">KN</span><span>Lab Runner</span></div>

    <div class="progress-wrap">
      <div class="eyebrow">Progress</div>
      <div class="row" style="justify-content:space-between;align-items:baseline;margin-top:4px">
        <span class="progress-num" id="pct">0%</span>
        <span style="font-size:12px;color:var(--faint)" id="pcount">0 / 0 steps</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
    </div>

    <div class="panel">
      <h4>Azure — live</h4>
      <div id="azPanel"><div class="stat"><span style="color:var(--faint)">checking…</span></div></div>
    </div>

    <div class="panel">
      <h4>Terraform</h4>
      <div id="tfPanel"><div class="stat"><span style="color:var(--faint)">checking…</span></div></div>
      <button class="btn" id="tfRefresh" style="margin-top:10px;width:100%;justify-content:center">Re-run check</button>
    </div>

    <div class="panel">
      <h4>Evidence</h4>
      <div id="evPanel"><div class="stat"><span style="color:var(--faint)">checking…</span></div></div>
    </div>

    <nav class="toc" id="toc"></nav>

    <div class="row" style="margin-top:auto;padding-top:12px">
      <button class="btn primary" id="guideBtn" style="width:100%;justify-content:center">Download full guide (PDF)</button>
      <button class="btn" id="pdfBtn" style="width:100%;justify-content:center;margin-top:8px">Progress report (PDF)</button>
      <button class="btn" id="exportBtn" style="width:100%;justify-content:center;margin-top:8px">Export notes → markdown</button>
      <a class="btn" id="viewGuide" href="/guide" target="_blank" style="width:100%;justify-content:center;margin-top:8px;text-decoration:none">Preview guide in browser</a>
    </div>
  </aside>

  <main class="main">
    <div id="content"><p class="lede">Loading lab…</p></div>
  </main>

</div>
<div class="toast" id="toast"></div>

<button id="chatFab" title="Ask about this step">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l2-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>
  Ask Claude
</button>

<div id="chatDock" role="dialog" aria-label="Lab tutor">
  <div class="chat-head">
    <div class="t">
      <b>Lab tutor</b>
      <span id="chatScope">general</span>
    </div>
    <button id="chatClear" title="Clear this thread" aria-label="Clear thread">&#8635;</button>
    <button id="chatClose" title="Close" aria-label="Close">&times;</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-hintrow" id="chatQuick"></div>
  <div class="chat-foot">
    <textarea id="chatInput" rows="1" placeholder="Ask about this step..."></textarea>
    <button id="chatSend">Send</button>
  </div>
</div>
<script src="app.js"></script>
<script src="chat.js"></script>
</body>
</html>
